# PostgreSQL profile - activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# or SPRING_PROFILES_ACTIVE=postgres
#
# Start the database first: docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/deliverydb
spring.datasource.username=delivery
spring.datasource.password=delivery
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
